name: CI — Build, SEO Audit & E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Build, Validate & Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro & TypeScript strict check
        run: npm run check

      - name: Build static site & run content/dist SEO validators
        run: npm run build

      - name: Run full test suite (SEO, Pages, Forms, CRM Security & Multi-Device E2E)
        run: npm test

      - name: Run responsive viewport audit (320px–1920px)
        run: npm run test:responsive
